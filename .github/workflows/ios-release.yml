name: iOS Release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (must increase on each upload)'
        required: true
        default: '1'
  push:
    tags:
      - 'ios-v*'

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      P8_B64: ${{ secrets.ASC_KEY_CONTENT }}
      BUILD_NO: ${{ github.event.inputs.build_number || '1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -e
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version
          fastlane --version

      - name: Write key and generate project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          # 兼容三种 Secret 写法：.p8 原文、单行 base64、带换行/空格的 base64
          RAW="$(printf '%s' "$P8_B64" | tr -d '[:space:]')"
          echo "secret chars: ${#P8_B64}, after stripping whitespace: ${#RAW}"
          if printf '%s' "$P8_B64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$P8_B64" > "$KEY_PATH"
          else
            if [ $(( ${#RAW} % 4 )) -ne 0 ]; then
              echo "::error::ASC_KEY_CONTENT 长度不是 4 的倍数（${#RAW}），说明不是合法 base64，请重新生成。"
              exit 1
            fi
            printf '%s' "$RAW" | base64 -D > "$KEY_PATH" || {
              echo "::error::ASC_KEY_CONTENT base64 解码失败，请重新生成后覆盖保存。"
              exit 1
            }
          fi
          if ! head -1 "$KEY_PATH" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::ASC_KEY_CONTENT 内容不对：既不是 .p8 文件原文，也不是 base64。请检查这个 Secret 后重跑。"
            exit 1
          fi
          echo "key ok: $(head -1 "$KEY_PATH")"
          sed -i '' "s/TEAM_ID_PLACEHOLDER/${TEAM_ID}/g" ios-build/project.yml ios-build/exportOptions.plist
          cp ios/AppIcon-1024.png ios-build/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          cd ios-build && xcodegen generate

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios-build/KuailePeqi.xcodeproj \
            -scheme KuailePeqi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KuailePeqi.xcarchive" \
            CURRENT_PROJECT_VERSION="${BUILD_NO}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            clean archive

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KuailePeqi.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios-build/exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to TestFlight
        working-directory: ios-build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          P8_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        run: IPA_PATH="$RUNNER_TEMP/export/KuailePeqi.ipa" fastlane ios to_testflight

      - name: Keep IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KuailePeqi-IPA
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
